name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token only ever needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless, so stop it (saves the matrix's minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure on one Node version should not hide the result on the other
      matrix:
        node: [24, 26] # 24 is the LTS in use today; 26 is next, so we learn about problems before adopting it
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      s3:
        image: motoserver/moto:latest # S3 emulator
        ports: ["5050:5000"]
      stripe-mock:
        image: stripe/stripe-mock:latest # validates requests against Stripe's OpenAPI spec
        ports: ["12111:12111"]
    env:
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:5050
      TEST_S3_ACCESS_KEY: test
      TEST_S3_SECRET_KEY: test
      TEST_STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Cache MongoDB binary for the in-memory test database
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npm test
        working-directory: server
      - name: Run the file-handling tests with the app on S3
        run: |
          curl -sf -X PUT http://localhost:5050/m-space-test
          npx vitest run tests/files.test.ts tests/rag-ai.test.ts tests/chat-realtime.test.ts
        working-directory: server
        env:
          STORAGE_DRIVER: s3
          S3_BUCKET: m-space-test
          S3_ENDPOINT: http://localhost:5050
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          S3_FORCE_PATH_STYLE: "true"
      - run: npm run build
        working-directory: server

  client:
    name: client (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    name: e2e (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [server, client]
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: tests
      - name: Cache MongoDB binary for the API's in-memory database
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npx playwright test
        working-directory: tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7

  # Builds the images and then actually runs the whole stack (nginx, backend, MongoDB, Redis) and talks to it, so problems in
  # the Alpine images, the nginx config or the compose wiring show up here instead of in production.
  docker:
    name: docker stack (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [server, client]
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - name: Use the Node ${{ matrix.node }} base image
        # The Dockerfiles pin the Node version literally (so Dependabot can track it); the 26 leg swaps it in for this run only.
        if: matrix.node != 24
        run: sed -i 's/node:24-alpine/node:${{ matrix.node }}-alpine/' server/Dockerfile client/Dockerfile
      - run: docker compose up -d --build
      - name: Wait for the stack to answer through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then echo "healthy after ~$((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "stack never became healthy"; docker compose ps; exit 1
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8080
          # nginx serves the built app, and unknown paths fall back to it for React Router
          curl -sf "$base/" | grep -q 'id="root"'
          curl -sf "$base/app/projects" | grep -q 'id="root"'
          # nginx -> backend -> MongoDB: register, log in, and get a wrong password refused
          email="ci-$RANDOM$RANDOM@example.test"
          curl -sf -X POST "$base/api/auth/register" -H 'content-type: application/json' \
            -d "{\"name\":\"CI\",\"email\":\"$email\",\"password\":\"password123\"}" | grep -q '"success":true'
          curl -sf -X POST "$base/api/auth/login" -H 'content-type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"password123\"}" | grep -q accessToken
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/auth/login" -H 'content-type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"wrong-password\"}")" = 401
          # the websocket path is proxied to the backend, not answered by nginx or a proxy error
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/socket.io/?EIO=4&transport=polling")
          echo "socket.io handshake status: $code"
          test "$code" != 404 && test "$code" != 502 && test "$code" != 504
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
