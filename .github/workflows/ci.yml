name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      s3:
        image: motoserver/moto:latest # S3 emulator
        ports: ["5050:5000"]
      stripe-mock:
        image: stripe/stripe-mock:latest # validates requests against Stripe's OpenAPI spec
        ports: ["12111:12111"]
    env:
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:5050
      TEST_S3_ACCESS_KEY: test
      TEST_S3_SECRET_KEY: test
      TEST_STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Cache MongoDB binary for the in-memory test database
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npm test
        working-directory: server
      - name: Run the file-handling tests with the app on S3
        run: |
          curl -sf -X PUT http://localhost:5050/m-space-test
          npx vitest run tests/files.test.ts tests/rag-ai.test.ts tests/chat-realtime.test.ts
        working-directory: server
        env:
          STORAGE_DRIVER: s3
          S3_BUCKET: m-space-test
          S3_ENDPOINT: http://localhost:5050
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          S3_FORCE_PATH_STYLE: "true"
      - run: npm run build
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: tests
      - name: Cache MongoDB binary for the API's in-memory database
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npx playwright test
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret
