# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services, both free tier:
#   - backend:  runs server/Dockerfile. Private services (pserv) aren't available on
#               Render's free plan, so this is a plain `web` service - it gets its own
#               public onrender.com URL too, but that's harmless: no browser ever talks
#               to it directly (see below), and every API route still requires auth.
#   - frontend: a public web service running client/Dockerfile (nginx), which proxies
#               /api and /socket.io to the backend's public URL over HTTPS - the same
#               same-origin-from-the-browser architecture already used and tested in
#               docker-compose (there, over the internal Docker network instead), so the
#               refresh-token cookie's SameSite=Lax setting keeps working unchanged (no
#               cross-origin cookie issues to work around). Not Render's private network:
#               free-tier services can send private-network requests but not receive
#               them, so the backend (also free-tier) isn't reachable that way - see
#               BACKEND_URL below.
#
# MongoDB isn't hosted by Render — use a free MongoDB Atlas (M0) cluster and paste its
# connection string into MONGODB_URI below once the service exists. Redis is skipped
# entirely for this demo tier; the app runs fine without it (in-memory queue/cache).
#
# Every `sync: false` value is a secret/credential and is intentionally left blank here —
# Render will prompt for it once, in its dashboard, when you create this Blueprint. See
# DEPLOY.md for exactly what to paste into each one.

services:
  - type: web
    name: backend
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false # the frontend's public onrender.com URL — fill in after the frontend service is created
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_GITHUB_CLIENT_ID
        sync: false
      - key: OAUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: "M-Space <no-reply@mspace.test>"
      - key: TRANSCRIBE_API_KEY
        sync: false
      - key: TRANSCRIBE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo

  - type: web
    name: frontend
    runtime: docker
    plan: free
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      # The backend's own public URL, e.g. https://backend-xxxx.onrender.com - copy it
      # from the backend service's page once it's deployed and paste it in here (there's
      # no Blueprint field for "a sibling service's public URL", only its private-network
      # host/port, which free-tier services can't be reached on). See DEPLOY.md.
      - key: BACKEND_URL
        sync: false
