services:
  frontend:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      # Without Stripe keys the server refuses plan changes in production; set true only for a demo.
      ALLOW_SIMULATED_BILLING: ${ALLOW_SIMULATED_BILLING:-false}
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/ai-productivity
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF keeps queued jobs across a Redis restart; noeviction stops Redis silently dropping queue keys under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  uploads:
